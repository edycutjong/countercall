name: release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write        # required to push the tag and create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — we read commits since the last tag

      # package.json is the single source of truth for the version.
      #
      # This step used to COMPUTE the next version from conventional-commit types since the
      # last tag. That made the tagger authoritative and package.json a bystander, and the
      # two immediately diverged: a feat commit tagged v1.1.0 while package.json still said
      # 1.0.0 and the landing page — which reads package.json — displayed v1.0.0. Three
      # surfaces, two answers. Now the file decides and the tag follows, so a release is a
      # deliberate act rather than a side effect of a commit message.
      - name: Read the version package.json declares
        id: ver
        run: |
          set -euo pipefail
          NEXT="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "${NEXT} is already tagged — nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Releasing ${NEXT}"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "skip=false"   >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.next }}" -m "${{ steps.ver.outputs.next }}"
          git push origin "${{ steps.ver.outputs.next }}"
          gh release create "${{ steps.ver.outputs.next }}" \
            --generate-notes --title "${{ steps.ver.outputs.next }}"
