name: release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write        # push the tag, push the stamp commit, create the Release
  actions:  write        # dispatch pages.yml — without this the dispatch 403s

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — we read commits since the last tag

      # Automatic semantic versioning from Angular-convention commits.
      #
      #   feat!: / BREAKING CHANGE:  -> major      feat:  -> minor
      #   fix: / perf:               -> patch      docs/chore/test/refactor/style/ci -> none
      #
      # The computed number is written back into package.json AND every page that prints a
      # version stamp, in the same commit that gets tagged. An earlier version of this
      # workflow only tagged, which drifted immediately: the tag said v1.1.0 while
      # package.json said 1.0.0 and the landing page displayed v1.0.0. Computing the version
      # and owning where it is written are the same job.
      - name: Compute next version from Angular commits
        id: ver
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            RANGE=""; CUR="0.0.0"
          else
            RANGE="${LAST}..HEAD"; CUR="${LAST#v}"
          fi
          LOG=$(git log --format=%B $RANGE)
          if [ -z "$(echo "$LOG" | tr -d '[:space:]')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BUMP=none
          echo "$LOG" | grep -qE '^(feat|fix|perf)(\(.+\))?!:|BREAKING CHANGE:' && BUMP=major
          [ "$BUMP" = none ] && echo "$LOG" | grep -qE '^feat(\(.+\))?:'        && BUMP=minor
          [ "$BUMP" = none ] && echo "$LOG" | grep -qE '^(fix|perf)(\(.+\))?:'  && BUMP=patch
          if [ "$BUMP" = none ]; then
            echo "No releasable commits since ${LAST:-the beginning}."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          IFS=. read -r MA MI PA <<< "$CUR"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="v${MA}.${MI}.${PA}"
          echo "Bump: $BUMP  ${LAST:-none} -> $NEXT"
          echo "next=$NEXT"  >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP"  >> "$GITHUB_OUTPUT"
          echo "skip=false"  >> "$GITHUB_OUTPUT"

      - name: Stamp the version into every surface
        if: steps.ver.outputs.skip == 'false'
        run: |
          set -euo pipefail
          node scripts/set_version.mjs "${{ steps.ver.outputs.next }}"
          node scripts/set_version.mjs "${{ steps.ver.outputs.next }}" --check

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # chore(release) is deliberately a NON-RELEASABLE type: the next run computes
          # BUMP=none from it and stops. That — not [skip ci] — is the loop guard.
          #
          # [skip ci] was here and it was wrong. It skips EVERY workflow, Pages included, so
          # the commit carrying the new version stamp never deployed and the live site sat one
          # release behind for good: repo v1.2.0, countercall.edycu.dev still showing v1.1.0.
          # Letting the stamp commit build costs one extra CI run and is the whole point of
          # stamping it.
          git add package.json web/index.html web/404.html web/pitch/index.html
          git commit -m "chore(release): ${{ steps.ver.outputs.next }}" || echo "nothing to stamp"
          git push origin HEAD:main
          git tag -a "${{ steps.ver.outputs.next }}" -m "${{ steps.ver.outputs.next }}"
          git push origin "${{ steps.ver.outputs.next }}"

          # The release is the load-bearing artefact, so it is created BEFORE the deploy is
          # requested. The first version had them the other way round: the dispatch 403'd for
          # want of actions:write, the step exited non-zero, and tag v1.3.1 shipped with no
          # release behind it. A best-effort follow-up must never abort what it follows.
          gh release create "${{ steps.ver.outputs.next }}" \
            --generate-notes --title "${{ steps.ver.outputs.next }}"

          # A push made with the default GITHUB_TOKEN does NOT trigger workflows — GitHub
          # blocks that to prevent recursion. So the stamp commit lands with the new version
          # in web/ and Pages never rebuilds, leaving the site one release behind until some
          # later human commit happens to deploy it. Removing the skip-ci flag was necessary
          # and not sufficient; the deploy has to be asked for by name.
          gh workflow run pages.yml --ref main \
            && echo "Requested a Pages deploy for ${{ steps.ver.outputs.next }}." \
            || echo "::warning::Pages dispatch failed; the site catches up on the next push." 
