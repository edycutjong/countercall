blank_issues_enabled: false
contact_links:
  - name: 🔒 Report a security issue
    url: https://github.com/edycutjong/countercall/security/advisories/new
    about: >
      Do not open a public issue. This includes any path that dials an unsourced number,
      renders a checklist from an unvalidated result, or bypasses the one-call-per-day
      idempotency key — see SECURITY.md.

  - name: 📞 Question about CALL-E itself
