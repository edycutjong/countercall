    about: >
      For the Goals API, the SDK, or account and billing questions, the CALL-E Discord is
      faster than this repo. Findings we filed upstream are in FEEDBACK.md.

  - name: 📋 For judges
    url: https://github.com/edycutjong/countercall/blob/main/JUDGE.md
    about: The claim, the 30-second path, the receipts, and the honest limitations.
